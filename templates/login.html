<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Curador de Conocimiento Asistido</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
</head>
<body>
    <main class="container auth-page">
        <section class="login-container">
            <article class="login-card">
                <header class="login-header">
                    <div class="brand auth-brand">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="lectIA" class="brand-logo">
                        <span class="brand-name">lectIA</span>
                    </div>
                    <h1>Gestor de Subidas</h1>
                    <p>Inicia sesión para continuar</p>
                </header>

                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}

                <form method="POST" class="login-form">
                    <div class="form-group">
                        <label for="login">Usuario o Correo</label>
                        <input type="text" id="login" name="login" required placeholder="Ingresa tu usuario o correo">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Inicia Sesión</button>
                </form>

                <div class="login-footer">
                    <div class="login-divider">
                        <p>¿No tienes cuenta? <a href="{{ url_for('signup') }}" class="text-link">Créala aquí</a></p>
                    </div>
                    <p>Credenciales de demostración:</p>
                    <div class="credentials">
                        <div class="credential-item">
                            <strong>Admin:</strong>
                            <code>admin / admin123</code>
                        </div>
                        <div class="credential-item">
                            <strong>Profesor:</strong>
                            <code>profesor / prof123</code>
                        </div>
                        <div class="credential-item">
                            <strong>Estudiante:</strong>
                            <code>estudiante / est123</code>
                        </div>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
